# Envoi d'une alerte La Liasse par Brevo.
#
# Automatique :
#   - chaque nouveau fichier déposé dans alertes/ part en TEST vers EMAIL_TEST (Eole) ;
#   - chaque fichier déposé dans envois/ (contenant le nom d'une alerte) déclenche
#     l'ENVOI de cette alerte aux inscrits. Ce dépôt n'est fait qu'après le « Envoyer » d'Eole.
# À la main : onglet Actions › « Envoyer une alerte » › Run workflow
#   fichier = nom du fichier dans alertes/ (ex. 2026-11-12-epargne-oubliee.txt)
#   mode    = test (à toi seulement) ou envoyer (aux inscrits concernés)
#
# Secrets (Settings › Secrets and variables › Actions) : BREVO_API_KEY, EMAIL_TEST
name: Envoyer une alerte

on:
  workflow_dispatch:
    inputs:
      fichier:
        description: "Fichier dans alertes/ (ex. 2026-11-12-epargne-oubliee.txt)"
        required: true
      mode:
        description: "test = à toi seulement ; envoyer = aux inscrits concernés"
        required: true
        default: test
        type: choice
        options: [test, envoyer]
  push:
    branches: [main]
    paths: ["alertes/**.txt", "envois/**.txt"]

jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Lancement à la main : le fichier et le mode choisis.
      - name: Vérifier l'alerte (aperçu)
        if: github.event_name == 'workflow_dispatch'
        run: python3 outils/envoyer_alerte.py "alertes/${{ inputs.fichier }}" --apercu
      - name: Envoyer par Brevo
        if: github.event_name == 'workflow_dispatch'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_TEST: ${{ secrets.EMAIL_TEST }}
        run: python3 outils/envoyer_alerte.py "alertes/${{ inputs.fichier }}" --${{ inputs.mode }}

      # Nouveau fichier déposé : test seulement, jamais d'envoi aux inscrits.
      - name: Tester les alertes déposées
        if: github.event_name == 'push'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_TEST: ${{ secrets.EMAIL_TEST }}
        run: |
          git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'alertes/*.txt' > nouvelles.txt || true
          if [ ! -s nouvelles.txt ]; then echo "Aucune alerte nouvelle ou modifiée."; exit 0; fi
          while read -r f; do
            echo "== $f"
            python3 outils/envoyer_alerte.py "$f" --test
          done < nouvelles.txt

      # Feu vert d'Eole : un fichier envois/XXX.txt contient le nom de l'alerte à envoyer.
      - name: Envoyer les alertes validées
        if: github.event_name == 'push'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_TEST: ${{ secrets.EMAIL_TEST }}
        run: |
          git diff --name-only --diff-filter=A HEAD~1 HEAD -- 'envois/*.txt' > validees.txt || true
          if [ ! -s validees.txt ]; then echo "Aucun envoi validé."; exit 0; fi
          while read -r v; do
            nom=$(head -n 1 "$v" | tr -d '[:space:]')
            if [ ! -f "alertes/$nom" ]; then echo "ERREUR : alertes/$nom introuvable (dans $v)"; exit 1; fi
            echo "== envoi de alertes/$nom"
            python3 outils/envoyer_alerte.py "alertes/$nom" --envoyer
          done < validees.txt
